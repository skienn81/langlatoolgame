# ═══════════════════════════════════════════════════════════════════════════
# ĐỘI HÌNH — FILE MẪU. Thay hết tên nick bằng username thật của bạn.
#
# Cú pháp:
#   [loai:ten]      mở một khối
#   dòng có "="     khai tham số hoặc vai (truong / mo_cua / nhan_do)
#   dòng trơn       một USERNAME thành viên
#   "#"             ghi chú, tính tới hết dòng
#
# Sửa file này xong bấm nút là ăn ngay, KHÔNG cần khởi động lại Manager.
# ═══════════════════════════════════════════════════════════════════════════

[chung]
# Máy bạn mở nổi bao nhiêu client cùng lúc. Máy chủ cũng thường chặn số client trên
# một IP — lấy số NHỎ HƠN trong hai cái. Nút 🚀 Khởi chạy đọc số này để không mở quá tay:
# vượt trần thì nick cuối login hỏng giữa chừng, mà lúc đó rất khó lần ra vì sao.
max_client      = 12

# Login: chờ mỗi lần bao nhiêu giây, và kẹt thì tắt client login lại mấy lần.
# "Vào được game" tính bằng tên nhân vật + máu + level, KHÔNG tính bằng level: client kẹt
# ở màn đăng nhập vẫn báo Lv.1. Hết lượt thử thì tắt hẳn client đó để khỏi ăn suất của trần.
login_cho_giay = 120
login_thu_lai  = 2


# ── TEAM ──────────────────────────────────────────────────────────────────
# Mỗi dòng một USERNAME (tên đăng nhập, KHÔNG phải tên nhân vật).
# Team dùng để gom nick theo nhóm cho gọn khi khai [agt]; các nút hoạt động đều chạy theo
# Ô TÍCH ✔ trên lưới, không theo team.

[team:1]
nick_01
nick_02
nick_03
nick_04
nick_05

[team:2]
nick_06
nick_07
nick_08


# ── CẤM THUẬT: mỗi nhóm 1 trưởng + 3 thành viên ───────────────────────────
# Trưởng nhóm đi tìm khu trống rồi lập nhóm, thành viên chờ lời mời.
# MỌI nick trong nhóm phải đang trong game lúc bấm chạy — thiếu một người là cả nhóm ngồi
# chờ một người không bao giờ tới. Các nhóm xuất phát ở khu lệch nhau để khỏi giẫm chân.

[camthuat:CT-1]
truong = nick_01
nick_02
nick_03
nick_04

[camthuat:CT-2]
truong = nick_05
nick_06
nick_07
nick_08


# ── SƠN CÁP: mỗi nhóm 1 trưởng + 5 thành viên ─────────────────────────────
[soncap:SC-1]
truong = nick_01
nick_02
nick_03
nick_04
nick_05
nick_06


# ── ẢI GIA TỘC ────────────────────────────────────────────────────────────
# KHÔNG khai thành viên: nút 🏰 lấy mọi nick ĐANG TRONG GAME làm người vào ải, nên không bao
# giờ lệch với thực tế.
#
#   mo_cua = <username>   nick đó tự đi mở cửa ải, mở xong cả đội mới vào.
#                         CHỈ dùng khi nick đó THẬT SỰ có quyền mở (trưởng / trưởng lão gia tộc).
#
#   mo_cua =              để TRỐNG: không nick nào mở cửa, cả đội chỉ VÀO một cửa ải người khác
#                         đã mở sẵn. Đây mới là trường hợp thường gặp — phần lớn tài khoản chỉ
#                         có quyền vào chứ không có quyền mở.
#
# Khai nhầm một nick KHÔNG có quyền mở vào mo_cua: tool bấm mở, server từ chối, mà map cũng
# không đổi — tool không phân biệt được với "mở xong nhưng chưa vào", nên sẽ báo đã mở rồi hô
# cả đội vào một cửa chưa mở. Muốn bịt hẳn thì khai agt_open_ok_keyword trong quest_anchors.cfg.

[agt]
mo_cua =


# ── GOM ĐỒ ────────────────────────────────────────────────────────────────
# nhan_do = nick nhận hết đồ.
# KHÔNG khai thành viên: nút 🎒 lấy mọi nick ĐANG TRONG GAME làm người giao đồ. Khai sẵn thì
# luôn lệch với thực tế — nick khai mà không online thì hàng đợi phải bỏ qua, nick online mà
# không khai thì ôm đồ ngồi đó.
# Món nào được gom thì khai ở gom_item_ids trong quest_anchors.cfg.

[gom]
nhan_do = nick_01
