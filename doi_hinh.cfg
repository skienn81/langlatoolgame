# ═══════════════════════════════════════════════════════════════════════════
# ĐỘI HÌNH — DÙNG CHUNG CHO MỌI HOẠT ĐỘNG (Cấm thuật, Sơn cáp, Auto NV, Địa cung...)
#
# Cú pháp:
#   [team:tenTeam]  mở một khối đội hình (vd: [team:1], [team:team1])
#   truong = nick   khai đội trưởng (hoặc nick đầu tiên trong khối làm trưởng)
#   nick_02         các thành viên trong nhóm
#   "#"             ghi chú, tính tới hết dòng
#
# Đội hình này được dùng CHUNG cho tất cả các hoạt động:
#   - Cấm thuật: /ct hoặc nút Cấm thuật trên tool
#   - Sơn cáp:   /sc hoặc nút Sơn cáp trên tool
#   - Auto NV / Địa cung theo team: /nv team1, /dc team1, /kill team1, /wake team1
#
# Quản lý trực tiếp qua Telegram:
#   /team list                  Xem danh sách đội hình
#   /team team1                 Xem chi tiết & trạng thái online của team
#   /team team1 add nick1 nick2 Thêm nick vào đội hình
#   /team team1 del nick1       Xoá nick khỏi đội hình (tự đôn trưởng nhóm mới)
#   /team team1 lead nick2      Đổi trưởng nhóm
#   /team del team1             Xoá toàn bộ 1 đội hình
# ═══════════════════════════════════════════════════════════════════════════

