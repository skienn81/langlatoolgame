# ══ BÙA UẾ THỔ ══════════════════════════════════════════════════════════════
# Người chơi khác dùng vật phẩm 617 "Bùa uế thổ" lên nick mình: nhân vật chết và KHÔNG được tự
# hồi sinh hay về thành cho tới khi có người nhập đúng mã captcha.
#
# KHÔNG TỰ HẾT. "5 phút" là hạn dùng của lá bùa bên kẻ yểm, không phải hạn chịu của nạn nhân —
# đã dính thì nằm tới lúc nhập đúng mã, hoặc tắt hẳn client. Mọi thứ dưới đây phải đọc theo mốc
# đó: một đường báo hỏng ở đây không làm mất "vài phút", nó làm mất cả buổi treo của một nick.
#
# Vì sao phải dò: nick nằm chết KHÔNG sinh gói sự kiện nào — nó im hệt nick đang đánh ngon. Còn
# máy trạng thái của hoạt động thì vẫn đếm hạn rồi báo "het gio o buoc N", tức đổ lỗi sai chỗ và
# bỏ dở lượt đang chạy. Biết đúng lý do là thứ rẻ nhất mà đắt giá nhất ở đây.
#
# Dò được vì chuỗi nằm trong bảng hằng chữ của CLIENT (com/c/a/a.class), không phải server đẩy.
set,bua_ue_tho_bao,1
set,bua_ue_tho_soi_ms,3000
# Chuỗi nhận biết — so KHÔNG DẤU và không phân biệt hoa thường, nên gõ kiểu nào cũng được.
#
# CHỈ LẤY PHẦN CHUNG, đừng lấy cả câu. Game dùng HAI câu khác nhau cho cùng một chuyện:
#   lúc bị yểm      : "<tên> đã yểm bùa uế thổ, nhập mã đã giải trừ bùa chú"
#   lúc định hồi sinh: "Bạn không thể hồi sinh do dính bùa uế thổ, vui lòng nhập Captcha..."
# Đặt là "yem bua ue tho" thì khớp câu đầu và TRƯỢT câu sau — mà câu sau mới là câu hiện lúc
# nick đang nằm đó, tức trượt đúng lúc cần. Đo thật 16:23 ngày 09/08.
set,bua_ue_tho_chu,bua ue tho
# 1 = lần ĐẦU gặp thì mổ xẻ chồng bảng ra file soi, để tìm chỗ giữ ảnh captcha và ô nhập mã.
# Bảng chỉ hiện 5 phút và không gọi ra theo ý muốn được, nên phải chộp ngay lúc gặp.
set,bua_ue_tho_dump,1
set,bua_ue_tho_dump_sau,3
# Số ký tự tối đa gom được từ chồng bảng khi phải dùng phép đọc RỘNG (quét mọi trường String).
set,bua_ue_tho_chu_toi_da,4000
# Bảng trong game là một CÂY widget: câu thông báo nằm ở widget CON (a.bd.ae), không nằm ở node
# trên cùng — đo được lúc 16:30 ngày 09/08, trên cùng chỉ có ba cái nhãn. Nên phải duyệt cây.
# Hai con số dưới đây là dây cương: sâu tối đa mấy tầng, và tối đa bao nhiêu node mỗi lượt soi.
# Thiếu chúng thì mỗi 3 giây lại đi duyệt gần hết bộ nhớ game.
set,bua_ue_tho_sau,3
set,bua_ue_tho_so_node,400
# LƯỚI ĐỠ: bảng nào cũng được đóng trong vài giây, nên một bảng mở LIÊN TỤC quá lâu tự nó đã là
# bất thường — mổ nó ra dù không khớp chữ nào. Cắt được cái vòng luẩn quẩn "không nhận ra được
# thì không có dữ liệu để học cách nhận ra".
# ĐỂ 0. Lưới đỡ này là GIÀN GIÁO, đã xong việc: nhờ nó mới mổ được bảng captcha để biết nó là
# lớp a.ew. Từ khi nhận biết bằng lớp bảng thì nó thành thừa — mà bật lên thì mọi nick đứng yên
# quá 60 giây đều đổ nguyên cả a.z vào log (đo 18:04, hai nick không hề bị yểm). Chỉ bật lại khi
# cần mổ một bảng lạ khác.
set,bua_ue_tho_dump_bang_li,0
set,bua_ue_tho_bang_li_ms,60000
set,bua_ue_tho_dump_cach_ms,600000

# ── CHUYỂN TIẾP CAPTCHA ──────────────────────────────────────────────────────
# Tool KHÔNG giải mã. Nó gửi tấm ảnh lên Telegram cho người thật xem, người đó reply lại 4 ký tự,
# rồi tool gõ hộ vào ô — bàn phím nối dài, không phải cái đầu.
#
# Chỗ đặt mọi thứ đọc từ bản mổ 16:30 ngày 09/08:
#   bảng   a.ew   ·   ảnh  aT.d -> a.fV (Pixmap 80x50)   ·   ô nhập  ew.h -> a.fY   ·   nút  aT.F -> a.by
set,bua_ue_tho_lop_bang,a.ew
# NHẬN BIẾT BẰNG BẢNG, KHÔNG BẰNG CHỮ. Ba lần dính bùa (16:23 / 16:30 / 16:44 ngày 09/08) đều
# dựng a.ew với M=-44, mà bản mổ toàn cây widget KHÔNG chứa chữ "bùa"/"yểm"/"uế thổ" nào — game
# lấy câu từ bảng hằng chữ lúc VẼ, không cất vào bảng. Nên khớp chữ không bao giờ ăn.
# Để bua_ue_tho_ma_bang trống/không khai thì nhận mọi a.ew bất kể mã loại.
set,bua_ue_tho_truong_ma,M
set,bua_ue_tho_ma_bang,-44
# S giữ TÊN KẺ YỂM ('xinhghe' lúc 16:44), rỗng khi game dùng câu không kèm tên. KHÔNG phải ô nhập.
set,bua_ue_tho_truong_ke_yem,S
set,bua_ue_tho_truong_o_nhap,h
# CHƯA BIẾT trường nào của ô nhập giữ chữ — lúc trống thì cái nào cũng rỗng nên không phân biệt
# được bằng cách nhìn. Ghi vào cả danh sách rồi log ra đã ghi được những cái nào; chạy thật một
# lần là biết cái nào ăn, rút danh sách lại bằng cách sửa dòng này, KHÔNG phải dựng lại jar.
set,bua_ue_tho_o_nhap_truong,ap,n,Q,R,aq
# ĐỂ TRỐNG. Trước đây khai là S — nhưng S giữ TÊN KẺ YỂM, ghi mã vào đó là xoá mất tên chứ không
# nhập được gì. Chỉ điền lại dòng này nếu bản mổ chỉ ra một trường khác của BẢNG thật sự giữ chữ.
set,bua_ue_tho_bang_truong,
# In danh sách HÀM của bảng ra file soi — mảnh cuối còn thiếu là cách KÍCH HOẠT nút Xác nhận.
set,bua_ue_tho_dump_ham,1
# Tên hàm bấm Xác nhận. Chỉ khai TÊN — tool tự chọn bản nhận String (truyền mã vào) hoặc bản
# không tham số, khỏi phải khai kiểu.
#
# BẤM VÀO ĐỐI TƯỢNG NÚT, không phải vào bảng. Đọc BẢNG PHƯƠNG THỨC thật của từng lớp:
#     a.ew :  b(La/A;)V   ⇒ hàm VẼ (a.A là lớp đồ hoạ)   ·   a(La/dI;II)V ⇒ xử lý sự kiện
#     a.by :  b()V        ⇒ KHÔNG tham số, trên chính đối tượng NÚT ⇒ đây mới là "bấm"
# Cùng tên 'b', hai nghĩa khác hẳn tuỳ đối tượng. Lần đầu khai nhầm sang bảng nên không gọi ra gì.
#
# ĐƯỜNG CHÍNH: dựng gói tin và gửi, đúng thứ nút Xác nhận làm. Giải mã a.ew.a(La/dI;II)V ra:
#     a.ew.a() -> a.fY  ·  a.fY.a() -> String  ·  a.ew.M : byte
#     a.fm.c(byte) -> a.fm  ·  a.fm.m(String)  ·  a.fm.aG()
# Tức "bấm Xác nhận" rốt cuộc chỉ là dựng một gói rồi gửi — khỏi phải chế sự kiện chuột giả.
# LƯU Ý: M là MÃ LỆNH CỦA GÓI, không phải mã loại bảng (lúc đầu hiểu nhầm). Đọc sống từ bảng chứ
# không nhúng số vào code, để server đổi mã lệnh thì vẫn chạy đúng.
set,bua_ue_tho_gui_goi,1
set,bua_ue_tho_fm_tao,c
set,bua_ue_tho_fm_gui,aG
# GÕ SAI THÌ GỬI LẠI ẢNH MỚI. Captcha cố tình khó đọc (I hoa với l thường, 0 với O, 1 với l) nên
# gõ sai là chuyện thường. Bảng CÒN Ở ĐÓ sau khi đã gửi mã = mã sai — quan sát trực tiếp, không
# phải suy đoán. KHÔNG gửi ảnh mới: đo thật cho thấy game GIỮ NGUYÊN mã cũ sau khi trượt, nên
# tấm ảnh đang có vẫn đúng — đọc lại rồi reply tiếp vào chính nó. Gửi thêm tấm y hệt chỉ làm rác
# nhóm và đẩy tấm đang cần nhìn trôi lên xa.
set,bua_ue_tho_cho_ket_ms,4000
# NGƯỠNG NHẮC, KHÔNG PHẢI TRẦN DỪNG. Trượt quá số này thì đổi câu báo thành "cân nhắc vào game
# gõ tay", nhưng đường reply VẪN MỞ và vẫn ăn. Bản đầu dừng hẳn ở đây (và Manager xoá luôn mục
# chờ) — sai, vì bùa không tự tan: dừng thử lại là tự tay khoá nick vĩnh viễn. 0 = không nhắc.
set,bua_ue_tho_thu_lai_max,4
# ĐƯỜNG LUI (chỉ dùng khi gửi gói hỏng): gọi một hàm trên nút hoặc trên bảng.
#   bam_o = nut  → gọi trên đối tượng ở truong_nut (aT.F)   ·   bam_o = bang → gọi trên a.ew
# Để trống ham_xac_nhan = không dùng đường lui. Đã đo: a.by.b() KHÔNG phải nút bấm (gọi được mà
# bảng không đóng), còn a.ew.b(a.A) là hàm VẼ.
set,bua_ue_tho_bam_o,nut
set,bua_ue_tho_truong_nut,F
set,bua_ue_tho_ham_xac_nhan,

# Ảnh: Pixmap của libgdx xếp hàng điểm ảnh từ TRÊN xuống, còn giao diện game vẽ theo hệ y-hướng-
# xuống nên nó lật lúc vẽ ⇒ ảnh đọc thẳng từ bộ nhớ bị LỘN NGƯỢC so với màn hình. Lật lại.
set,bua_ue_tho_lat_anh,1
# Ảnh gốc chỉ 80x50, trên điện thoại bé bằng con tem. Phóng bằng NearestNeighbour (không nội suy)
# vì captcha là nét mảnh, làm mượt là nhoè mất đúng thứ cần đọc.
set,bua_ue_tho_phong_to,4

